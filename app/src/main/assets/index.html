<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SCRAP//YARD</title>
<style>
:root{--bg:#05080d;--p:#0b141d;--line:#20384a;--txt:#eefaff;--mut:#8ea7b8;--g:#8dff00;--c:#4edcff;--m:#d54cff;--y:#ffd23f;--r:#ff5a5f}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(circle at top,#102636,#05080d 46%);color:var(--txt);font-family:Arial,sans-serif;min-height:100vh}.app{max-width:520px;margin:auto;padding:14px 14px 94px}.brand{font-size:29px;font-weight:900}.brand b{color:var(--g)}.tag{font-size:11px;letter-spacing:2px;color:#a7ecff}.ver{float:right;color:#66889b;font-size:10px;margin-top:8px}.stats{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:7px;margin:12px 0}.stat,.card{background:#08121bcc;border:1px solid var(--line);border-radius:12px;padding:11px;box-shadow:0 8px 24px #0005}.k,.sub{font-size:11px;color:var(--mut)}.v{font-size:18px;font-weight:900}.money{color:var(--g)}.energy{color:var(--m)}.screen{display:none}.screen.active{display:block}.title{font-size:12px;letter-spacing:1.5px;color:#a9c6d5;font-weight:800;margin:13px 2px 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{padding:12px}.item.selected{border-color:var(--g);box-shadow:0 0 18px #7dff0040}.icon{height:72px;display:grid;place-items:center;font-size:42px;border:1px solid var(--line);border-radius:9px;background:linear-gradient(145deg,#0b1722,#081018)}.name{font-weight:900;margin-top:8px}.rarity{font-size:10px;font-weight:900}.common{color:var(--c)}.rare{color:var(--y)}.epic{color:var(--m)}.legendary{color:#ff934d}.price{font-size:20px;color:var(--g);font-weight:900;margin-top:6px}.btn{width:100%;padding:11px 8px;border-radius:9px;border:1px solid #34556a;background:#0c1a25;color:white;font-weight:900;margin-top:8px}.btn.g{border-color:#5ba500;background:#12240b}.btn.c{border-color:#35aace}.btn.m{border-color:#a73bc8}.btn.y{border-color:#9b7d00;background:#241d05}.btn:disabled{opacity:.35}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.meter{height:8px;background:#142532;border-radius:10px;overflow:hidden;margin-top:5px}.meter span{display:block;height:100%;background:linear-gradient(90deg,#ff684d,var(--y),var(--g));transition:.25s}.fault{display:flex;justify-content:space-between;padding:8px;border:1px solid #203746;border-radius:8px;margin-top:5px}.ok{color:var(--g)}.bad{color:var(--r)}.big{font-size:24px;font-weight:900}.repairTrack{position:relative;height:46px;border:1px solid #34566d;background:#09141d;border-radius:10px;overflow:hidden;margin:18px 0}.sweet{position:absolute;left:38%;width:24%;top:0;bottom:0;background:#285f31}.needle{position:absolute;top:-4px;bottom:-4px;width:5px;background:white;box-shadow:0 0 12px white}.empty{text-align:center;color:var(--mut);padding:28px 12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#05090df2;border-top:1px solid #20384a;backdrop-filter:blur(8px)}.nav{max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:7px}.nav button{background:none;border:0;color:#708a9a;font-size:9px}.nav span{display:block;font-size:20px;margin-bottom:2px}.nav button.active{color:var(--g)}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:83px;background:#0b1822;border:1px solid #31566c;border-radius:9px;padding:9px 13px;opacity:0;pointer-events:none;transition:.2s;z-index:20;white-space:nowrap}.toast.show{opacity:1}.badge{display:inline-block;padding:3px 6px;border-radius:999px;border:1px solid #31566c;font-size:9px;color:#a9c6d5}.profit{font-size:28px;color:var(--g);font-weight:900}.achievement{margin-top:7px;padding:9px;border-radius:8px;border:1px solid #203746}.achievement.done{border-color:#5ba500;background:#12240b}.daily{border-color:#6a5200;background:linear-gradient(145deg,#241d05,#0b141d)}.pulse{animation:pulse .7s ease}@keyframes pulse{50%{transform:scale(1.03);filter:brightness(1.3)}}
</style></head><body><div class="app"><div class="brand">SCRAP//<b>YARD</b><span class="ver">v0.3</span></div><div class="tag">REPAIR. FLIP. PROFIT.</div><div class="stats"><div class="stat"><div class="k">CASH</div><div id="cash" class="v money"></div></div><div class="stat"><div class="k">LEVEL</div><div id="level" class="v"></div><div id="xp" class="sub"></div></div><div class="stat"><div class="k">ENERGY</div><div id="energy" class="v energy"></div></div></div><section id="workshop" class="screen active"></section><section id="market" class="screen"></section><section id="inventory" class="screen"></section><section id="repair" class="screen"></section><section id="upgrades" class="screen"></section></div><div id="toast" class="toast"></div><div class="bottom"><div class="nav"><button data-s="workshop" class="active"><span>🛠️</span>WORK</button><button data-s="market"><span>🛒</span>MARKET</button><button data-s="inventory"><span>📦</span>STOCK</button><button data-s="repair"><span>⚡</span>REPAIR</button><button data-s="upgrades"><span>⬆️</span>UPGRADE</button></div></div>
<script>
const ITEMS=[
['Cracked Phone','📱',120,300,'common',['Cracked Screen','Battery Fault']],['Game Console','🎮',220,520,'rare',['HDMI Fault','Overheating']],['Power Tool','🔧',90,240,'common',['Motor Brushes','Trigger Fault']],['Gaming Laptop','💻',360,920,'epic',['Broken Display','Cooling Fault','Battery Fault']],['Retro Console','🕹️',140,420,'rare',['No Video','Power Fault']],['Mystery Electronics','❓',70,250,'epic',['Unknown Fault','Power Fault']],['Tablet','📟',150,390,'common',['Touch Fault','Charge Port']],['Graphics Card','🧩',310,760,'epic',['Fan Fault','VRAM Instability']],['Drone','🚁',260,680,'rare',['Motor Fault','Camera Fault']],['Smart Watch','⌚',85,230,'common',['Battery Fault','Dead Pixels']],['Camera','📷',240,640,'rare',['Lens Error','Shutter Fault']],['Vintage Amplifier','🎛️',330,980,'legendary',['Capacitor Failure','Channel Fault','Noisy Potentiometer']]];
const ACH=[['first','FIRST FLIP','Sell your first repaired item',1],['five','SIDE HUSTLE','Sell 5 items',5],['profit1k','FOUR FIGURES','Earn $1,000 lifetime profit',1000],['perfect','SURGEON','Complete a near-perfect repair',1],['level5','YARD BOSS','Reach level 5',5]];
const D={cash:850,xp:0,level:1,energy:5,maxEnergy:5,inventory:[],market:[],activeId:null,up:{bench:1,scanner:1,parts:1,access:1},stats:{bought:0,sold:0,profit:0,perfect:0},ach:{},lastSeen:Date.now(),daily:0};let S=load(),needle=0,dir=1,timer=null;
function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{let x=Object.assign(clone(D),JSON.parse(localStorage.getItem('scrapyard-save')||'{}'));x.stats=Object.assign(clone(D.stats),x.stats||{});x.ach=x.ach||{};x.up=Object.assign(clone(D.up),x.up||{});return x}catch(e){return clone(D)}}
function save(){S.lastSeen=Date.now();localStorage.setItem('scrapyard-save',JSON.stringify(S));topbar()}function money(n){return '$'+Math.round(n).toLocaleString()}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500)}function beep(freq=420,d=.06){try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;g.gain.value=.035;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}function topbar(){cash.textContent=money(S.cash);level.textContent=S.level;xp.textContent=S.xp+' / '+(S.level*180)+' XP';energy.textContent=S.energy+'/'+S.maxEnergy}function xp(n){S.xp+=n;let up=false;while(S.xp>=S.level*180){S.xp-=S.level*180;S.level++;S.energy=S.maxEnergy;up=true}save();if(up){beep(740,.14);toast('LEVEL UP • '+S.level);checkAchievements()}}
function make(i){let a=ITEMS[i],access=1+(S.up.access-1)*.03,q=.75+Math.random()*.4,c=Math.floor(25+Math.random()*55);return{id:Date.now()+'-'+Math.random(),name:a[0],icon:a[1],buy:Math.round(a[2]*q/access),resale:a[3],rarity:a[4],faults:a[5],condition:c,diagnosed:false,repaired:false,tested:false,score:0}}
function refresh(free=false){let cost=free?0:Math.max(10,30-S.up.access*2);if(S.cash<cost)return toast('Need '+money(cost));S.cash-=cost;S.market=Array.from({length:6},()=>make(Math.floor(Math.random()*ITEMS.length)));save();renderMarket();if(cost)toast('Market refreshed • '+money(cost))}
function current(){if(!S.inventory.length)return null;let x=S.inventory.find(i=>i.id===S.activeId);if(!x){x=S.inventory[0];S.activeId=x.id}return x}function selectItem(id){S.activeId=id;save();renderInv();renderWork();renderRepair();show('workshop');toast('Project selected')}
function buy(id){let i=S.market.findIndex(x=>x.id==id),x=S.market[i];if(!x)return;if(S.cash<x.buy)return toast('Not enough cash');if(S.inventory.length>=8+S.up.bench*2)return toast('Inventory full');S.cash-=x.buy;S.inventory.push(x);S.activeId=x.id;S.market.splice(i,1);S.stats.bought++;save();beep(300);renderAll();toast('Stock purchased')}
function diagnose(){let x=current();if(!x)return toast('Buy stock first');if(x.diagnosed)return;if(S.energy<1)return toast('No energy');S.energy--;x.diagnosed=true;save();beep(500);xp(12);renderAll();toast(x.faults.length+' faults found')}
function startRepair(){let x=current();if(!x||!x.diagnosed||x.repaired)return;clearInterval(timer);needle=0;dir=1;timer=setInterval(()=>{needle+=dir*(2.5+Math.max(0,3-S.up.bench)*.15);if(needle>=100||needle<=0)dir*=-1;let e=document.querySelector('.needle');if(e)e.style.left=needle+'%'},24);beep(230)}
function lockRepair(){let x=current();if(!x)return;if(!timer)return toast('Tap START first');clearInterval(timer);timer=null;let score=needle>=43&&needle<=57?1:Math.max(.35,1-Math.abs(50-needle)/70);x.score=score;x.repaired=true;x.condition=Math.min(100,Math.round(66+score*30+S.up.parts*2));if(score>.94)S.stats.perfect++;save();beep(score>.94?850:560,.12);xp(Math.round(20+score*34));renderAll();checkAchievements();toast(score>.94?'PERFECT REPAIR!':'Repair '+Math.round(score*100)+'%')}
function test(){let x=current();if(!x||!x.repaired)return toast('Repair it first');if(x.tested)return;if(S.energy<1)return toast('No energy');S.energy--;x.tested=true;x.condition=Math.min(100,x.condition+S.up.scanner);save();beep(650);xp(10);renderAll();toast('All systems functional')}
function sell(id){let i=S.inventory.findIndex(x=>x.id==id),x=S.inventory[i];if(!x||!x.tested)return toast('Test it first');let rarityBoost={common:1,rare:1.04,epic:1.08,legendary:1.14}[x.rarity]||1,sale=Math.round(x.resale*(.72+x.condition/330)*(1+S.up.parts*.015)*rarityBoost),p=sale-x.buy;S.cash+=sale;S.stats.sold++;S.stats.profit+=p;S.inventory.splice(i,1);if(S.activeId===id)S.activeId=S.inventory[0]?.id||null;save();beep(780,.14);xp(Math.max(15,Math.round(p/8)));renderAll();checkAchievements();toast('SOLD '+money(sale)+' • +'+money(p))}
function upgrade(k,b){let cost=b*S.up[k];if(S.cash<cost)return toast('Not enough cash');S.cash-=cost;S.up[k]++;if(k==='bench'){S.maxEnergy=Math.min(10,S.maxEnergy+1);S.energy=Math.min(S.maxEnergy,S.energy+1)}save();beep(700);renderAll();toast('Upgrade installed')}
function claimDaily(){let day=Math.floor(Date.now()/86400000);if(S.daily===day)return toast('Daily crate already claimed');let streak=S.daily===day-1?Math.min(7,(S.dailyStreak||0)+1):1,reward=120+streak*55;S.daily=day;S.dailyStreak=streak;S.cash+=reward;S.energy=S.maxEnergy;save();beep(900,.16);renderAll();toast('DAILY CRATE +'+money(reward))}
function offlineReward(){let now=Date.now(),elapsed=Math.max(0,now-(S.lastSeen||now)),mins=Math.floor(elapsed/60000);if(mins>=10){let cap=Math.min(mins,480),gain=Math.floor(cap*(2+S.up.bench*.7));S.cash+=gain;S.energy=Math.min(S.maxEnergy,S.energy+Math.floor(mins/45));S.lastSeen=now;save();setTimeout(()=>toast('OFFLINE EARNINGS +'+money(gain)),400)}}
function checkAchievements(){let vals={first:S.stats.sold,five:S.stats.sold,profit1k:S.stats.profit,perfect:S.stats.perfect,level5:S.level};let bonus=0;for(let a of ACH){if(!S.ach[a[0]]&&vals[a[0]]>=a[3]){S.ach[a[0]]=true;bonus+=150}}if(bonus){S.cash+=bonus;save();toast('ACHIEVEMENT BONUS +'+money(bonus));beep(980,.15)}}
function renderWork(){let x=current(),e=document.getElementById('workshop'),day=Math.floor(Date.now()/86400000),canDaily=S.daily!==day;e.innerHTML='<div class="title">DAILY OPERATIONS</div><div class="card daily"><div class="row"><div><b>SUPPLY CRATE</b><div class="sub">Cash + full energy • streak '+(S.dailyStreak||0)+'</div></div><span style="font-size:28px">🎁</span></div><button class="btn y" '+(!canDaily?'disabled':'')+' onclick="claimDaily()">'+(canDaily?'CLAIM DAILY CRATE':'CLAIMED TODAY')+'</button></div><div class="title">CURRENT PROJECT</div>';
if(!x){e.innerHTML+='<div class="card empty"><div style="font-size:55px">🧰</div><h2>Workbench Empty</h2><p>Buy damaged stock and start flipping.</p><button class="btn g" onclick="show(\'market\')">OPEN MARKET</button></div>'; } else {let f=x.diagnosed?x.faults.map(z=>'<div class="fault"><span>'+z+'</span><b class="'+(x.repaired?'ok':'bad')+'">'+(x.repaired?'FIXED':'FAULT')+'</b></div>').join(''):'<div class="fault"><span>Fault data encrypted</span><b>???</b></div>';e.innerHTML+='<div class="card"><div class="row"><div><div class="big">'+x.icon+' '+x.name+'</div><span class="rarity '+x.rarity+'">'+x.rarity.toUpperCase()+'</span></div><b>'+money(x.buy)+'</b></div><div class="sub">Estimated resale</div><div class="big money">'+money(x.resale*.82)+' – '+money(x.resale*1.08)+'</div><div class="row sub"><span>CONDITION</span><b>'+x.condition+'%</b></div><div class="meter"><span style="width:'+x.condition+'%"></span></div>'+f+'<button class="btn m" onclick="diagnose()" '+(x.diagnosed?'disabled':'')+'>DIAGNOSE</button><button class="btn c" onclick="show(\'repair\')" '+(!x.diagnosed||x.repaired?'disabled':'')+'>REPAIR</button><button class="btn g" onclick="test()" '+(!x.repaired||x.tested?'disabled':'')+'>TEST</button>'+(x.tested?'<button class="btn g" onclick="sell(\''+x.id+'\')">SELL FOR PROFIT</button>':'')+'</div>'}
e.innerHTML+='<div class="title">CAREER</div><div class="card"><div class="row"><b>Items Flipped</b><span>'+S.stats.sold+'</span></div><div class="row"><b>Lifetime Profit</b><span class="money">'+money(S.stats.profit)+'</span></div><div class="row"><b>Perfect Repairs</b><span>'+S.stats.perfect+'</span></div></div><div class="title">ACHIEVEMENTS</div><div class="card">'+ACH.map(a=>'<div class="achievement '+(S.ach[a[0]]?'done':'')+'"><b>'+(S.ach[a[0]]?'✓ ':'')+a[1]+'</b><div class="sub">'+a[2]+'</div></div>').join('')+'</div>'}
function renderMarket(){if(!S.market.length)S.market=Array.from({length:6},()=>make(Math.floor(Math.random()*ITEMS.length)));let cost=Math.max(10,30-S.up.access*2);market.innerHTML='<div class="title">DAMAGED STOCK MARKET</div><div class="grid">'+S.market.map(x=>'<div class="card item"><div class="icon">'+x.icon+'</div><div class="name">'+x.name+'</div><div class="rarity '+x.rarity+'">'+x.rarity.toUpperCase()+'</div><div class="sub">'+x.condition+'% condition • resale '+money(x.resale)+'</div><div class="price">'+money(x.buy)+'</div><button class="btn g" onclick="buy(\''+x.id+'\')">BUY</button></div>').join('')+'</div><button class="btn" onclick="refresh()">↻ REFRESH MARKET • '+money(cost)+'</button>'}
function renderInv(){inventory.innerHTML='<div class="title">INVENTORY • '+S.inventory.length+'/'+(8+S.up.bench*2)+' SLOTS</div>'+(S.inventory.length?'<div class="grid">'+S.inventory.map(x=>'<div class="card item '+(x.id===S.activeId?'selected':'')+'"><div class="icon">'+x.icon+'</div><div class="name">'+x.name+'</div><div class="rarity '+x.rarity+'">'+x.rarity.toUpperCase()+'</div><div class="sub">'+x.condition+'% condition</div><div class="meter"><span style="width:'+x.condition+'%"></span></div><div class="sub">'+(x.tested?'✅ Ready to sell':x.repaired?'🧪 Needs testing':x.diagnosed?'🔧 Needs repair':'🔍 Needs diagnosis')+'</div><button class="btn '+(x.tested?'g':'c')+'" onclick="'+(x.tested?'sell(\''+x.id+'\')':'selectItem(\''+x.id+'\')')+'">'+(x.tested?'SELL':'SELECT')+'</button></div>').join('')+'</div>':'<div class="card empty">No stock yet.</div>')}
function renderRepair(){let x=current();repair.innerHTML='<div class="title">REPAIR BAY</div>'+(x?'<div class="card"><div class="big">'+x.icon+' '+x.name+'</div><div class="sub">Keep the needle in the center green zone. Workbench upgrades make control easier.</div>'+(!x.diagnosed?'<div class="empty">Diagnose this item first.</div>':x.repaired?'<div class="empty"><div style="font-size:50px">✅</div><h2>Repair Complete</h2><p>Quality '+Math.round(x.score*100)+'%</p></div>':'<div class="repairTrack"><div class="sweet"></div><div class="needle"></div></div><button class="btn c" onclick="startRepair()">START</button><button class="btn g" onclick="lockRepair()">LOCK REPAIR</button>')+'</div>':'<div class="card empty">No project selected.</div>')}
function renderUp(){let u=[['bench','WORKBENCH','Storage + energy',500],['scanner','SCANNER','Better test results',650],['parts','PARTS QUALITY','Higher resale',800],['access','MARKET ACCESS','Cheaper refresh + deals',900]];upgrades.innerHTML='<div class="title">WORKSHOP UPGRADES</div><div class="grid">'+u.map(a=>'<div class="card"><b>'+a[1]+'</b><div class="sub">LEVEL '+S.up[a[0]]+' • '+a[2]+'</div><button class="btn g" onclick="upgrade(\''+a[0]+'\','+a[3]+')">'+money(a[3]*S.up[a[0]])+'</button></div>').join('')+'</div><div class="title">SAVE DATA</div><div class="card"><div class="sub">Progress is stored only on this device.</div><button class="btn" onclick="if(confirm(\'Reset all SCRAP//YARD progress?\')){localStorage.clear();location.reload()}">RESET GAME</button></div>'}
function show(id){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('active',e.id===id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.s===id));if(id==='workshop')renderWork();if(id==='market')renderMarket();if(id==='inventory')renderInv();if(id==='repair')renderRepair();if(id==='upgrades')renderUp()}
function renderAll(){topbar();renderWork();renderMarket();renderInv();renderRepair();renderUp()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.s));offlineReward();if(!S.market.length)refresh(true);renderAll();checkAchievements();
</script></body></html>
