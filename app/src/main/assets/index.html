<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SCRAP//YARD</title>
<style>
:root{--bg:#05080d;--p:#0b141d;--line:#20384a;--txt:#eefaff;--mut:#8ea7b8;--g:#8dff00;--c:#4edcff;--m:#d54cff;--y:#ffd23f;--r:#ff5a5f}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(circle at top,#102636,#05080d 45%);color:var(--txt);font-family:Arial,sans-serif}.app{max-width:520px;margin:auto;padding:14px 14px 90px}.brand{font-size:29px;font-weight:900}.brand b{color:var(--g)}.tag{font-size:11px;letter-spacing:2px;color:#a7ecff}.stats{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:7px;margin:12px 0}.stat,.card{background:#08121bcc;border:1px solid var(--line);border-radius:12px;padding:11px}.k,.sub{font-size:11px;color:var(--mut)}.v{font-size:18px;font-weight:900}.money{color:var(--g)}.energy{color:var(--m)}.screen{display:none}.screen.active{display:block}.title{font-size:12px;letter-spacing:1.5px;color:#a9c6d5;font-weight:800;margin:13px 2px 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{padding:12px}.icon{height:72px;display:grid;place-items:center;font-size:42px;border:1px solid var(--line);border-radius:9px;background:#0b1722}.name{font-weight:900;margin-top:8px}.rarity{font-size:10px}.common{color:var(--c)}.rare{color:var(--y)}.epic{color:var(--m)}.price{font-size:20px;color:var(--g);font-weight:900;margin-top:6px}.btn{width:100%;padding:11px 8px;border-radius:9px;border:1px solid #34556a;background:#0c1a25;color:white;font-weight:900;margin-top:8px}.btn.g{border-color:#5ba500;background:#12240b}.btn.c{border-color:#35aace}.btn.m{border-color:#a73bc8}.btn:disabled{opacity:.35}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.meter{height:8px;background:#142532;border-radius:10px;overflow:hidden;margin-top:5px}.meter span{display:block;height:100%;background:linear-gradient(90deg,#ff684d,var(--y),var(--g))}.fault{display:flex;justify-content:space-between;padding:8px;border:1px solid #203746;border-radius:8px;margin-top:5px}.ok{color:var(--g)}.bad{color:var(--r)}.big{font-size:24px;font-weight:900}.repairTrack{position:relative;height:46px;border:1px solid #34566d;background:#09141d;border-radius:10px;overflow:hidden;margin:18px 0}.sweet{position:absolute;left:38%;width:24%;top:0;bottom:0;background:#285f31}.needle{position:absolute;top:-4px;bottom:-4px;width:5px;background:white;box-shadow:0 0 12px white}.empty{text-align:center;color:var(--mut);padding:28px 12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#05090df2;border-top:1px solid #20384a}.nav{max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:7px}.nav button{background:none;border:0;color:#708a9a;font-size:9px}.nav span{display:block;font-size:20px;margin-bottom:2px}.nav button.active{color:var(--g)}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:83px;background:#0b1822;border:1px solid #31566c;border-radius:9px;padding:9px 13px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1}
</style></head><body><div class="app"><div class="brand">SCRAP//<b>YARD</b></div><div class="tag">REPAIR. FLIP. PROFIT.</div><div class="stats"><div class="stat"><div class="k">CASH</div><div id="cash" class="v money"></div></div><div class="stat"><div class="k">LEVEL</div><div id="level" class="v"></div><div id="xp" class="sub"></div></div><div class="stat"><div class="k">ENERGY</div><div id="energy" class="v energy"></div></div></div><section id="workshop" class="screen active"></section><section id="market" class="screen"></section><section id="inventory" class="screen"></section><section id="repair" class="screen"></section><section id="upgrades" class="screen"></section></div><div id="toast" class="toast"></div><div class="bottom"><div class="nav"><button data-s="workshop" class="active"><span>🛠️</span>WORK</button><button data-s="market"><span>🛒</span>MARKET</button><button data-s="inventory"><span>📦</span>STOCK</button><button data-s="repair"><span>⚡</span>REPAIR</button><button data-s="upgrades"><span>⬆️</span>UPGRADE</button></div></div>
<script>
const ITEMS=[['Cracked Phone','📱',120,300,'common',['Cracked Screen','Battery Fault']],['Game Console','🎮',220,520,'rare',['HDMI Fault','Overheating']],['Power Tool','🔧',90,240,'common',['Motor Brushes','Trigger Fault']],['Gaming Laptop','💻',360,920,'epic',['Broken Display','Cooling Fault','Battery Fault']],['Retro Console','🕹️',140,420,'rare',['No Video','Power Fault']],['Mystery Electronics','❓',70,250,'epic',['Unknown Fault','Power Fault']]];
const D={cash:850,xp:0,level:1,energy:5,maxEnergy:5,inventory:[],market:[],up:{bench:1,scanner:1,parts:1,access:1},stats:{bought:0,sold:0,profit:0}};let S=load(),needle=0,dir=1,timer=null;
function load(){try{return Object.assign(structuredClone(D),JSON.parse(localStorage.getItem('scrapyard-save')||'{}'))}catch(e){return structuredClone(D)}}function save(){localStorage.setItem('scrapyard-save',JSON.stringify(S));topbar()}function money(n){return '$'+Math.round(n).toLocaleString()}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1300)}function topbar(){cash.textContent=money(S.cash);level.textContent=S.level;xp.textContent=S.xp+' XP';energy.textContent=S.energy+'/'+S.maxEnergy}function xp(n){S.xp+=n;let need=S.level*180;while(S.xp>=need){S.xp-=need;S.level++;S.energy=S.maxEnergy;toast('LEVEL UP!');need=S.level*180}save()}
function make(i){let a=ITEMS[i],q=.75+Math.random()*.4,c=Math.floor(25+Math.random()*55);return{id:Date.now()+'-'+Math.random(),name:a[0],icon:a[1],buy:Math.round(a[2]*q),resale:a[3],rarity:a[4],faults:a[5],condition:c,diagnosed:false,repaired:false,tested:false,score:0}}
function refresh(){S.market=Array.from({length:6},()=>make(Math.floor(Math.random()*ITEMS.length)));save();renderMarket()}function current(){return S.inventory[0]}function buy(id){let i=S.market.findIndex(x=>x.id==id),x=S.market[i];if(!x)return;if(S.cash<x.buy)return toast('Not enough cash');if(S.inventory.length>=8+S.up.bench*2)return toast('Inventory full');S.cash-=x.buy;S.inventory.push(x);S.market.splice(i,1);S.stats.bought++;save();renderMarket();renderWork();renderInv();toast('Stock purchased')}
function diagnose(){let x=current();if(!x)return toast('Buy stock first');if(S.energy<1)return toast('No energy');S.energy--;x.diagnosed=true;save();xp(12);renderWork();toast('Faults found')}
function startRepair(){let x=current();if(!x||!x.diagnosed||x.repaired)return;clearInterval(timer);needle=0;dir=1;timer=setInterval(()=>{needle+=dir*2.3;if(needle>=100||needle<=0)dir*=-1;let e=document.querySelector('.needle');if(e)e.style.left=needle+'%'},24)}function lockRepair(){let x=current();if(!x)return;if(!timer)return toast('Tap START first');clearInterval(timer);timer=null;let score=needle>=38&&needle<=62?1:Math.max(.35,1-Math.abs(50-needle)/70);x.score=score;x.repaired=true;x.condition=Math.min(100,Math.round(68+score*30+S.up.parts*2));save();xp(Math.round(20+score*30));renderRepair();renderWork();renderInv();toast(score>.95?'PERFECT REPAIR!':'Repair complete')}
function test(){let x=current();if(!x||!x.repaired)return toast('Repair it first');if(S.energy<1)return toast('No energy');S.energy--;x.tested=true;x.condition=Math.min(100,x.condition+S.up.scanner);save();xp(10);renderWork();renderInv();toast('All systems functional')}
function sell(id){let i=S.inventory.findIndex(x=>x.id==id),x=S.inventory[i];if(!x||!x.tested)return toast('Test it first');let sale=Math.round(x.resale*(.72+x.condition/330)*(1+S.up.parts*.015)),p=sale-x.buy;S.cash+=sale;S.stats.sold++;S.stats.profit+=p;S.inventory.splice(i,1);save();xp(Math.max(15,Math.round(p/8)));renderInv();renderWork();toast('SOLD '+money(sale)+' • '+money(p)+' profit')}
function upgrade(k,b){let cost=b*S.up[k];if(S.cash<cost)return toast('Not enough cash');S.cash-=cost;S.up[k]++;if(k==='bench')S.maxEnergy=Math.min(10,S.maxEnergy+1);save();renderUp();toast('Upgrade installed')}
function renderWork(){let x=current(),e=document.getElementById('workshop');if(!x){e.innerHTML='<div class="title">CURRENT PROJECT</div><div class="card empty"><div style="font-size:55px">🧰</div><h2>Workbench Empty</h2><p>Buy damaged stock and start flipping.</p><button class="btn g" onclick="show(\'market\')">OPEN MARKET</button></div><div class="title">CAREER</div><div class="card"><div class="row"><b>Items Flipped</b><span>'+S.stats.sold+'</span></div><div class="row"><b>Lifetime Profit</b><span class="money">'+money(S.stats.profit)+'</span></div></div>';return}let f=x.diagnosed?x.faults.map(z=>'<div class="fault"><span>'+z+'</span><b class="'+(x.repaired?'ok':'bad')+'">'+(x.repaired?'FIXED':'FAULT')+'</b></div>').join(''):'<div class="fault"><span>Fault data encrypted</span><b>???</b></div>';e.innerHTML='<div class="title">CURRENT PROJECT</div><div class="card"><div class="row"><div><div class="big">'+x.icon+' '+x.name+'</div><span class="rarity '+x.rarity+'">'+x.rarity.toUpperCase()+'</span></div><b>'+money(x.buy)+'</b></div><div class="sub">Estimated resale</div><div class="big money">'+money(x.resale*.82)+' – '+money(x.resale*1.08)+'</div><div class="row sub"><span>CONDITION</span><b>'+x.condition+'%</b></div><div class="meter"><span style="width:'+x.condition+'%"></span></div>'+f+'<button class="btn m" onclick="diagnose()" '+(x.diagnosed?'disabled':'')+'>DIAGNOSE</button><button class="btn c" onclick="show(\'repair\')" '+(!x.diagnosed||x.repaired?'disabled':'')+'>REPAIR</button><button class="btn g" onclick="test()" '+(!x.repaired||x.tested?'disabled':'')+'>TEST</button>'+(x.tested?'<button class="btn g" onclick="sell(\''+x.id+'\')">SELL FOR PROFIT</button>':'')+'</div>'}
function renderMarket(){if(!S.market.length)S.market=Array.from({length:6},()=>make(Math.floor(Math.random()*ITEMS.length)));market.innerHTML='<div class="title">DAMAGED STOCK MARKET</div><div class="grid">'+S.market.map(x=>'<div class="card item"><div class="icon">'+x.icon+'</div><div class="name">'+x.name+'</div><div class="rarity '+x.rarity+'">'+x.rarity.toUpperCase()+'</div><div class="sub">'+x.condition+'% condition • resale '+money(x.resale)+'</div><div class="price">'+money(x.buy)+'</div><button class="btn g" onclick="buy(\''+x.id+'\')">BUY</button></div>').join('')+'</div><button class="btn" onclick="refresh()">↻ REFRESH MARKET</button>'}
function renderInv(){inventory.innerHTML='<div class="title">INVENTORY • '+S.inventory.length+'/'+(8+S.up.bench*2)+' SLOTS</div>'+(S.inventory.length?'<div class="grid">'+S.inventory.map(x=>'<div class="card item"><div class="icon">'+x.icon+'</div><div class="name">'+x.name+'</div><div class="sub">'+x.condition+'% condition</div><div class="meter"><span style="width:'+x.condition+'%"></span></div><div class="sub">'+(x.tested?'✅ Ready to sell':x.repaired?'🧪 Needs testing':x.diagnosed?'🔧 Needs repair':'🔍 Needs diagnosis')+'</div><button class="btn '+(x.tested?'g':'c')+'" onclick="'+(x.tested?'sell(\''+x.id+'\')':'show(\'workshop\')')+'">'+(x.tested?'SELL':'WORK ON')+'</button></div>').join('')+'</div>':'<div class="card empty">No stock yet.</div>')}
function renderRepair(){let x=current();repair.innerHTML='<div class="title">REPAIR BAY</div>'+(x?'<div class="card"><div class="big">'+x.icon+' '+x.name+'</div><div class="sub">Keep the needle in the green zone.</div>'+(!x.diagnosed?'<div class="empty">Diagnose this item first.</div>':x.repaired?'<div class="empty"><div style="font-size:50px">✅</div><h2>Repair Complete</h2><p>Quality '+Math.round(x.score*100)+'%</p></div>':'<div class="repairTrack"><div class="sweet"></div><div class="needle"></div></div><button class="btn c" onclick="startRepair()">START</button><button class="btn g" onclick="lockRepair()">LOCK REPAIR</button>')+'</div>':'<div class="card empty">No project selected.</div>')}
function renderUp(){let u=[['bench','WORKBENCH','Storage + energy',500],['scanner','SCANNER','Better test results',650],['parts','PARTS QUALITY','Higher resale',800],['access','MARKET ACCESS','Better stock access',900]];upgrades.innerHTML='<div class="title">WORKSHOP UPGRADES</div><div class="grid">'+u.map(a=>'<div class="card"><b>'+a[1]+'</b><div class="sub">LEVEL '+S.up[a[0]]+' • '+a[2]+'</div><button class="btn g" onclick="upgrade(\''+a[0]+'\','+a[3]+')">'+money(a[3]*S.up[a[0]])+'</button></div>').join('')+'</div><div class="title">SAVE DATA</div><button class="btn" onclick="if(confirm(\'Reset progress?\')){localStorage.clear();location.reload()}">RESET GAME</button>'}
function show(id){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('active',e.id===id));document.querySelectorAll('.nav button').forEach(e=>e.classList.toggle('active',e.dataset.s===id));if(id==='workshop')renderWork();if(id==='market')renderMarket();if(id==='inventory')renderInv();if(id==='repair')renderRepair();if(id==='upgrades')renderUp();scrollTo(0,0)}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.s));topbar();renderWork();renderMarket();renderInv();renderRepair();renderUp();save();
</script></body></html>
