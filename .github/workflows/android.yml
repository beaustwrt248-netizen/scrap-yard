name: Build SCRAP-YARD Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check app/src/main/assets/core.js
          node --check app/src/main/assets/app9.js
          node --check app/src/main/assets/v12.js
          node --check app/src/main/assets/v13.js
          node --check app/src/main/assets/v17.js
          node --check app/src/main/assets/v15.js
          node --check app/src/main/assets/v18.js
          node --check app/src/main/assets/v19.js
          node --check app/src/main/assets/v20.js
          node --check app/src/main/assets/v21.js
          node --check app/src/main/assets/v22.js
      - name: Navigation and shop smoke test
        run: node tests/navigation-smoke.js
      - name: Verify v0.22 illustrated customer layer
        run: |
          grep -q 'v22.css' app/src/main/assets/index.html
          grep -q 'v22.js' app/src/main/assets/index.html
          grep -q 'v22Toon' app/src/main/assets/v22.css
          grep -q "Jake Miller" app/src/main/assets/v22.js
          grep -q "Luna Reyes" app/src/main/assets/v22.js
          grep -q "Marcus Hall" app/src/main/assets/v22.js
          grep -q "Mia Chen" app/src/main/assets/v22.js
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SCRAP-YARD-v0.22-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: SCRAP-YARD-v0.22-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
